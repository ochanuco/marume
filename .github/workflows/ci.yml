name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/go.yml@ddb8e656d5e975d255c122b0090df4efcb7a5cae # v1.8.0

  python:
    uses: ochanuco/.github/.github/workflows/uv.yml@ddb8e656d5e975d255c122b0090df4efcb7a5cae # v1.8.0
    with:
      python-version: "3.13"
      run: |
        uv sync --locked
        uv run ruff check .
        uv run pytest -q
